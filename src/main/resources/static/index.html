<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <!-- <script src="script.js" defer></script> -->
     <script src="js/scriptTeste.js" defer></script>
    <title>Minha Biblioteca</title>
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 Minha Biblioteca</h1>
            <p>Gerencie sua coleção de livros</p>
        </header>

        <div class="stats">
            <div class="stat-card">
                <h3 id="totalBooks">0</h3>
                <p>Total de Livros</p>
            </div>
            <div class="stat-card">
                <h3 id="booksRead">0</h3>
                <p>Livros Lidos</p>
            </div>
            <div class="stat-card">
                <h3 id="booksReading">0</h3>
                <p>Lendo Agora</p>
            </div>
            <div class="stat-card">
                <h3 id="booksToRead">0</h3>
                <p>Quero Ler</p>
            </div>
        </div>

        <div class="controls">
            <div class="controls-row">
                <input type="text" id="searchInput" placeholder="🔍 Buscar livros...">
                <select id="filterGenre">
                    <option value="">Todos os Gêneros</option>
                    <option value="Ficção">Ficção</option>
                    <option value="Não-ficção">Não-ficção</option>
                    <option value="Fantasia">Fantasia</option>
                    <option value="Romance">Romance</option>
                    <option value="Técnico">Técnico</option>
                </select>
                <select id="filterStatus">
                    <option value="">Todos os Status</option>
                    <option value="lido">Lido</option>
                    <option value="lendo">Lendo</option>
                    <option value="quero-ler">Quero Ler</option>
                </select>
                <button class="btn btn-primary" onclick="openAddModal()">➕ Adicionar Livro</button>
            </div>
        </div>

        <div class="books-grid" id="booksGrid">
            <!-- Livros serão inseridos aqui -->
        </div>
    </div>

    <!-- Modal para adicionar/editar livro -->
    <div class="modal" id="bookModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Adicionar Novo Livro</h2>
            </div>
            <form id="bookForm">
                <div class="form-group">
                    <label>Título *</label>
                    <input type="text" id="bookTitle" required>
                </div>
                <div class="form-group">
                    <label>Autor *</label>
                    <input type="text" id="bookAuthor" required>
                </div>
                <div class="form-group">
                    <label>Ano de Publicação</label>
                    <input type="number" id="bookYear" min="1000" max="2099">
                </div>
                <div class="form-group">
                    <label>Gênero</label>
                    <select id="bookGenre">
                        <option value="Ficção">Ficção</option>
                        <option value="Não-ficção">Não-ficção</option>
                        <option value="Fantasia">Fantasia</option>
                        <option value="Romance">Romance</option>
                        <option value="Técnico">Técnico</option>
                        <option value="Biografia">Biografia</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Status *</label>
                    <select id="bookStatus" required>
                        <option value="quero-ler">Quero Ler</option>
                        <option value="lendo">Lendo</option>
                        <option value="lido">Lido</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Observações</label>
                    <textarea id="bookNotes" placeholder="Anotações, comentários..."></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-cancel btn-small" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary btn-small">Salvar</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
